<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />

<h1 class="voice"><roundcube:label name="settings" /> : <roundcube:label name="sooma_smime.smime" /></h1>

<div id="layout-list" class="listbox selected" aria-labelledby="aria-label-sooma_smime-list">
	<div class="header">
		<a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="sooma_smime.settings" /></span>
		</a>
		<span id="aria-label-sooma_smime-list" class="header-title"><roundcube:label name="sooma_smime.smime" /></span>
		<a class="button icon toolbar-menu-button" href="#list-menu">
			<span class="inner"><roundcube:label name="menu" /></span>
		</a>
	</div>
	<div class="scroller">

        <table id="sooma-smime-list" class="listing iconized settings-default-icon focus" role="listbox" data-list="sooma_smime_list">
			<tbody>
            <tr class="settings focused sooma_smime_section_item" role="option" id="sooma_smime_options_button"><td class="section" tabindex="0"><roundcube:label name="sooma_smime.settings" /></td></tr>
			<tr class="certificates_title" role="option" id="sooma_smime_my_certificates_button"><td id="my_certificates_item" class="sooma_smime_my_certificates_item custom-control custom-switch" tabindex="1"><roundcube:label name="sooma_smime.myCerts" /></td></tr>
        	</tbody>
		</table>

		<roundcube:object 
            name="mycertslist"
            id="my_certs-table"
            class="listing hidden"
            role="treeitem"
            noheader="true"
		    data-list="sooma_mycertslist"
            data-label-msg="listempty" />

        <table id="sooma-smime-list" class="listing iconized settings-default-icon focus" role="listbox" data-list="sooma_smime_list">
			<tbody>
            <tr class="certificates_title" role="option" id="sooma_smime_public_certificates_button"><td id="public_certificates_item" class="sooma_smime_public_certificates_item custom-control custom-switch" tabindex="0"><roundcube:label name="sooma_smime.pubCerts" /></td></tr>
        	</tbody>
		</table>
        <roundcube:object
            name="othercertslist"
            id="sooma_other_certs-table"
            class="listing hidden"
            role="treeitem"
            noheader="true"
		    data-list="sooma_othercertslist"
            data-label-msg="listempty" />

	</div>
	<div class="pagenav menu footer small" role="toolbar" aria-label="<roundcube:label name="arialabellistnav" />">
		<roundcube:button command="firstpage" type="link" class="firstpage disabled" classAct="firstpage"
			title="firstpage" label="first" innerclass="inner" />
		<roundcube:button command="previouspage" type="link" class="prevpage disabled" classAct="prevpage"
			title="previouspage" label="previous" innerclass="inner" />
		<span class="pagenav-text" aria-live="polite" aria-relevant="text">
			<roundcube:object name="countdisplay" />
		</span>
		<roundcube:button command="nextpage" type="link" class="nextpage disabled" classAct="nextpage"
			title="nextpage" label="next" innerclass="inner" />
		<roundcube:button command="lastpage" type="link" class="lastpage disabled" classAct="lastpage"
			title="lastpage" label="last" innerclass="inner" />
	</div>
</div>

<div id="layout-content" role="main">
	<h2 id="aria-label-toolbar" class="voice"><roundcube:label name="arialabeltoolbar" /></h2>
	<div class="header" role="toolbar" aria-labelledby="aria-label-toolbar">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
		<div id="folderstoolbar" class="toolbar menu">
			<roundcube:button command="plugin.sooma-cert-delete" type="link" class="delete disabled" classAct="delete"
				label="delete" title="sooma_smime.deletecerts" innerClass="inner" />
			<roundcube:button command="plugin.sooma-cert-import" type="link" class="import enabled" classAct="import"
				label="import" title="sooma_smime.importcerts" innerClass="inner" />
		</div>
	</div>
	<div class="iframe-wrapper">
		<roundcube:object name="contentframe" id="keyframe" src="env:blankpage" />
	</div>
</div>

<roundcube:include file="includes/footer.html" />
