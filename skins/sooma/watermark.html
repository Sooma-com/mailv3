<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title></title>
  <style type="text/css">
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #fff;
    }

    html.dark-mode body {
      background-color: #21292c;
    }

    /* Heart mark. Static, hardcoded soft tints of sooma's brand red
       (rgb(213, 56, 50)) - deliberately NOT derived from a domain lookup
       or a cross-frame color read: this frame is served to every one of
       roughly 100k mailboxes at launch, so it's a plain static asset with
       no per-request PHP and no JS, safe to cache indefinitely. */
    #watermark {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30vw;
      height: 30vw;
      max-width: 220px;
      max-height: 220px;
      transform: translate(-50%, -50%);
      background-color: #f7d7d6;
      /* rgb(213, 56, 50) blended ~20% into white */
      -webkit-mask-image: url(images/logo.svg);
      mask-image: url(images/logo.svg);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      -webkit-mask-size: contain;
      mask-size: contain;
    }

    html.dark-mode #watermark {
      /* Same brand red, blended ~25% into the dark-mode background
         (#21292c) instead of white, so it stays equally soft/muted
         rather than turning into a bright pink patch on a dark page. */
      background-color: #4e2d2e;
    }
  </style>
</head>

<body>
  <div id="watermark"></div>
</body>

</html>
