dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1
auth_cache_negative_ttl = 1 mins
auth_cache_size = 100 m
auth_master_user_separator = *
auth_mechanisms = plain login
auth_policy_hash_mech = sha256
auth_policy_hash_nonce = 
auth_policy_hash_truncate = 12
auth_policy_reject_on_fail = no
auth_policy_server_api_header = 
auth_policy_server_url = 
auth_username_chars = ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz01234567890.-_@
base_dir = /var/run/dovecot-profissional_imap
default_client_limit = 500
default_process_limit = 50
auth_allow_cleartext = yes
doveadm_password = CleowAuhyShysk1
doveadm_port = 0
imap_capability {
 QUOTA = yes
 XLIST = yes
}
imap_hibernate_timeout = 5s
imap_max_line_length = 2m
imap_metadata = no
instance_name = dovecot-profissional_imap
lda_mailbox_autocreate = yes
lda_mailbox_autosubscribe = yes
listen = 0.0.0.0
login_trusted_networks = 127.0.0.0/8
mail_debug = yes
mail_compress_write_method = gz
mail_driver = Maildir
mail_gid = 1008
mail_plugins {
  quota = yes
  mail_compress = yes
  mail_log = yes
  notify = yes
}
mail_uid = 500
mail_max_userip_connections = 100
mailbox_list_index = yes
mailbox_list_index_very_dirty_syncs = yes
maildir_very_dirty_syncs = yes
protocols = imap pop3 lmtp sieve
quota_full_tempfail = yes
#ssl_server_cert_file = /opt/profissional-certs/certs/mail.sooma.com.pem
#ssl_server_key_file = /opt/profissional-certs/keys/mail.sooma.com.key
ssl_min_protocol = TLSv1.2
verbose_proctitle = yes

mail_log_events = delete undelete expunge copy mailbox_delete mailbox_rename
mail_log_fields = uid box msgid size
quota_storage_size = 100k
quota user {
  warning warn-80 {
    quota_storage_percentage = 80
    execute quota-warning {
      args = 80 %{user}
    }
  } 
  warning warn-90 {
    quota_storage_percentage = 90
    execute quota-warning {
      args = 80 %{user}
    }
  } 
  warning warn-100 {
    quota_storage_percentage = 100
    execute quota-warning {
      args = 80 %{user}
    }
  } 
}
sieve_script personal {
  driver = file
  path = ~/maildir/sieve
  active_path = .dovecot.sieve
}
sieve_script default {
  type = default
  name = default
  driver = file
  path = /etc/dovecot/multi/profissional_imap/ext/spam.sieve
}
sieve_vacation_send_from_recipient = yes
sieve_max_redirects = 100
sieve_redirect_envelope_from = user_email

service lmtp {
  inet_listener lmtp {
    port = 2525
  }
  vsz_limit=4096 MB
  process_limit = 20
}
service quota-warning {
  executable = script /etc/dovecot/multi/profissional_imap/ext/user_quota_warn
  unix_listener quota-warning {
    user = vmail
    group = vmail
    mode = 0600
  }
}
service stats {
  fifo_listener stats-mail {
    mode = 0600
    user = vmail
  }
}
service managesieve-login {
  inet_listener sieve_deprecated {
    port = 2000
    ssl = no
  }
}
service auth {
  unix_listener auth-userdb {
    group = vmail
    mode = 0776
  }
  unix_listener auth-master {
    group = vmail
    mode = 0660
  }
}
service doveadm {
  user = vmail
  inet_listener doveadm {
    port = 1900
  }
  unix_listener doveadm-server {
    group = vmail
    mode = 0660
  }
  vsz_limit=1024MB
}
service anvil {
  unix_listener anvil {
    group = vmail
    mode = 0660
  }
}
service imap-hibernate {
  unix_listener imap-hibernate {
    user = vmail
    group = vmail
    mode = 0660
  }
}
service dict {
  unix_listener dict {
    group = vmail
    mode = 0660
  }
}
service stats {
  unix_listener stats-reader {
    group = 
    mode = 0600
    user = 
  }
  unix_listener stats-writer {
    group = vmail
    mode = 0660
  }
}

service imap {
  unix_listener imap-master {
    user = vmail
    group = vmail
    mode = 0666
  }
  vsz_limit=4096 MB
}
protocol lda {
  mail_plugins {
    sieve = yes
  }
}
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}

namespace inbox {
  inbox = yes
  separator = .
  prefix =
  mailbox INBOX {
    auto = subscribe
  }
  mailbox Enviadas {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Lixo {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Rascunhos {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Spam {
    auto = subscribe
    special_use = \Junk
  }
  mailbox Arquivo {
    auto = subscribe
    special_use = \Archive
  }
}

sql_driver = pgsql
pgsql profissional {
  host = 127.0.0.1
  parameters {
    user = postfix
    dbname = mail_profissional
  }
}
userdb prefetch {
}
userdb profissional {
  driver = sql
  sql_query = \
SELECT \
 "username" AS "user", \
 "home" AS "home", \
 replace("mail", 'maildir:', '') AS "mail_path", \
 replace("quota_rule", '*:storage=', '') AS "quota_storage_percentage", \
 "username" AS "sieve_user_email" \
FROM "postfix"."logins" \
WHERE \
 ( \
   "auth_user" = lower('%{user | username}') \
  AND \
   "auth_domain" = lower('%{user | domain}') \
  OR ("auth_user" || '@' || "auth_domain" = (SELECT email FROM novis_username_map WHERE username = '%{user}')) \
 ) \
 AND \
  ( \
  "host" = '127.0.0.1' \
   OR \
    '%{protocol}' = 'doveadm' \
  )

}
passdb profissional {
  driver = sql
  sql_query = \
SELECT \
 "username" AS "user", \
 "password" AS "password", \
 "home" AS "home", \
 replace("mail", 'maildir:', '') AS "mail_path", \
 replace("quota_rule", '*:storage=', '') AS "quota_storage_percentage", \
 "username" AS "sieve_user_email" \
FROM "postfix"."logins" \
WHERE \
 ( \
   "auth_user" = lower('%{user | username}') \
  AND \
   "auth_domain" = lower('%{user | domain}') \
  OR ("auth_user" || '@' || "auth_domain" = (SELECT email FROM novis_username_map WHERE username = '%{user}')) \
 ) \
 AND \
  ( \
  "host" = '127.0.0.1' \
   OR \
    '%{protocol}' = 'doveadm' \
  )

}
